# ==========================================
# Monsur Ali Travels ERP - Development Nginx Configuration
# Domains: *.plexivia.online
# Admin Dashboard:  admin.plexivia.online -> 127.0.0.1:8017
# Client Dashboard: dash.plexivia.online  -> 127.0.0.1:8015
# Backend API:      server.plexivia.online -> 127.0.0.1:5093
# ==========================================

map $http_upgrade $dev_connection_upgrade {
    default upgrade;
    '' close;
}

upstream dev_backend_upstream {
    server 127.0.0.1:5093;
    keepalive 32;
}

upstream dev_admin_dashboard_upstream {
    server 127.0.0.1:8017;
    keepalive 32;
}

upstream dev_client_dashboard_upstream {
    server 127.0.0.1:8015;
    keepalive 32;
}

# 1. Dev Admin Dashboard (Port 8017)
server {
    listen 80;
    listen [::]:80;
    server_name admin.plexivia.online;

    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    location / {
        proxy_pass http://dev_admin_dashboard_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 2. Dev Client Dashboard (Port 8015)
server {
    listen 80;
    listen [::]:80;
    server_name dash.plexivia.online dashboard.plexivia.online;

    client_max_body_size 100M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    location / {
        proxy_pass http://dev_client_dashboard_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 3. Dev Backend API (Port 5093)
server {
    listen 80;
    listen [::]:80;
    server_name server.plexivia.online api.plexivia.online;

    client_max_body_size 100M;

    # Dev Uploads Static Assets
    location /uploads/ {
        alias /dev-env/var/www/uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type";
        access_log off;
    }

    location /src/uploads/ {
        alias /dev-env/var/www/uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type";
        access_log off;
    }

    location /api/v1/uploads/ {
        alias /dev-env/var/www/uploads/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type";
        access_log off;
    }

    # Dev Documents Static Assets
    location /documents/ {
        alias /dev-env/var/www/documents/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type";
        access_log off;
    }

    location /src/documents/ {
        alias /dev-env/var/www/documents/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type";
        access_log off;
    }

    location /api/v1/documents/ {
        alias /dev-env/var/www/documents/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS";
        add_header Access-Control-Allow-Headers "Origin, Accept, Content-Type";
        access_log off;
    }

    # Dev WebSocket / Socket.IO Proxy
    location /socket.io/ {
        proxy_pass http://dev_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dev_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Dev API Routes
    location / {
        proxy_pass http://dev_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dev_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | MAT Ops cPanel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#ecfdf5',
              500: '#10b981',
              600: '#059669',
              700: '#047857',
            },
            slate: {
              850: '#151f32',
              900: '#0f172a',
              950: '#090d16',
            }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #090d16;
      background-image: 
        radial-gradient(at 10% 15%, rgba(16, 185, 129, 0.08) 0px, transparent 40%),
        radial-gradient(at 90% 85%, rgba(2, 132, 199, 0.08) 0px, transparent 40%);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-slate-100 antialiased font-sans">
  <div class="w-full max-w-md">
    <!-- Card Container -->
    <div class="bg-slate-900/90 border border-slate-800 backdrop-blur-xl rounded-2xl shadow-2xl p-8">
      
      <!-- Brand & Header -->
      <div class="flex flex-col items-center text-center mb-8">
        <div class="w-14 h-14 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center mb-4 shadow-lg shadow-emerald-500/10">
          <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
          </svg>
        </div>
        <h1 class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
          Monsur Ali Travels
          <span class="px-2 py-0.5 text-xs font-semibold bg-emerald-500/20 text-emerald-400 rounded-full border border-emerald-500/30">Ops cPanel</span>
        </h1>
        <p class="text-sm text-slate-400 mt-1.5">Production Build & Deployment Management</p>
      </div>

      <!-- Error Alert -->
      <div id="errorAlert" class="hidden mb-6 p-3.5 rounded-xl bg-red-500/10 border border-red-500/20 text-red-400 text-xs font-medium flex items-center gap-2.5">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
        </svg>
        <span id="errorMessage">Invalid credentials.</span>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-5">
        <div>
          <label for="username" class="block text-xs font-medium text-slate-300 mb-1.5">Developer Username</label>
          <div class="relative">
            <input type="text" id="username" name="username" required autocomplete="username"
              class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all"
              placeholder="developer" value="developer">
          </div>
        </div>

        <div>
          <label for="password" class="block text-xs font-medium text-slate-300 mb-1.5">Security Password</label>
          <div class="relative">
            <input type="password" id="password" name="password" required autocomplete="current-password"
              class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition-all"
              placeholder="••••••••••••">
          </div>
        </div>

        <button type="submit" id="submitBtn"
          class="w-full mt-2 py-3 px-4 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-semibold rounded-xl text-sm transition-all duration-150 shadow-lg shadow-emerald-600/25 flex items-center justify-center gap-2 cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
          </svg>
          <span id="btnText">Access cPanel</span>
        </button>
      </form>

      <!-- Security Notice -->
      <div class="mt-8 pt-6 border-t border-slate-800/80 text-center">
        <p class="text-[11px] text-slate-400 flex items-center justify-center gap-1.5">
          <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
          </svg>
          Google Cloud Isolated Ops Session
        </p>
      </div>

    </div>
  </div>

  <script>
    const API_BASE = window.location.pathname.startsWith('/cpanel') ? '/cpanel' : '';
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const errorAlert = document.getElementById('errorAlert');
    const errorMessage = document.getElementById('errorMessage');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.add('hidden');
      submitBtn.disabled = true;
      btnText.textContent = 'Authenticating...';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const res = await fetch(`${API_BASE}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          window.location.href = API_BASE ? `${API_BASE}/` : '/';
        } else {
          errorMessage.textContent = data.error || 'Authentication failed.';
          errorAlert.classList.remove('hidden');
        }
      } catch (err) {
        errorMessage.textContent = 'Connection error. Please try again.';
        errorAlert.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = 'Access cPanel';
      }
    });
  </script>
</body>
</html>

services:
  postgres:
    image: postgres:16-alpine
    container_name: monsuralitravels-postgres-live
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MonsurAliSecPass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-monsur_ali_travels}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - monsuralitravels-net

  mongodb:
    image: mongo:7.0
    container_name: monsuralitravels-mongodb-live
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-MonsurAliSecPass2026!}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-monsur-ali-travels}
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - monsuralitravels-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monsuralitravels-backend-live
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - /var/www/uploads:/app/src/uploads
      - /var/www/documents:/app/src/documents
    environment:
      NODE_ENV: production
      PORT: 5092
    ports:
      - "5092:5092"
    depends_on:
      - mongodb
    networks:
      - monsuralitravels-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: monsuralitravels-frontend-live
    restart: always
    ports:
      - "8006:80"
    networks:
      - monsuralitravels-net

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://server.monsuralitravelsbd.com}
    container_name: monsuralitravels-dashboard-live
    restart: always
    ports:
      - "8005:80"
    networks:
      - monsuralitravels-net

networks:
  monsuralitravels-net:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  mongodb-data:
    driver: local

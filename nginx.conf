# Nginx Configuration for Monsur Ali Travels ERP

# 1. Admin Portal (React App)
server {
    listen 80;
    server_name admin.monsuralitravels.com;

    root /var/www/monsuralitravels/dashboard/dist/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy for Admin
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# 2. Client/Staff Portal (React App)
server {
    listen 80;
    server_name app.monsuralitravels.com dashboard.monsuralitravels.com;

    root /var/www/monsuralitravels/dashboard/dist/client;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy for Client
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# Nginx Configuration for Monsur Ali Travels ERP

# 1. Admin Portal (React App)
server {
    listen 80;
    server_name admin.monsuralitravels.com;

    # SSL Configuration (Uncomment after running certbot)
    # listen 443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/admin.monsuralitravels.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/admin.monsuralitravels.com/privkey.pem;

    root /var/www/monsuralitravels/admin-dashboard/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy for Admin
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

# 2. Client/Staff Portal (React App)
server {
    listen 80;
    server_name app.monsuralitravels.com;

    # SSL Configuration (Uncomment after running certbot)
    # listen 443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/app.monsuralitravels.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/app.monsuralitravels.com/privkey.pem;

    root /var/www/monsuralitravels/client-dashboard/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy for Client
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

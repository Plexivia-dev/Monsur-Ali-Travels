# 3. Backend API Domain Configuration (Port 5092)
server {
    server_name api.monsuralitravels.com server.monsuralitravels.com service.monsuralitravels.com server.monsuralitravelsbd.com service.monsuralitravelsbd.com;

    client_max_body_size 100M;

    # Uploads Static Assets
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location /src/uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Documents Static Assets
    location /documents/ {
        alias /var/www/documents/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location /src/documents/ {
        alias /var/www/documents/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # API Routes
    location / {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.monsuralitravels.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.monsuralitravels.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}


# 5. HTTP to HTTPS Redirections
server {
    listen 80;
    listen [::]:80;
    server_name admin.monsuralitravels.com dashboard.monsuralitravels.com dashboard.monsuralitravelsbd.com;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.monsuralitravels.com server.monsuralitravels.com service.monsuralitravels.com server.monsuralitravelsbd.com service.monsuralitravelsbd.com;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name monsuralitravels.com www.monsuralitravels.com monsuralitravelsbd.com www.monsuralitravelsbd.com;
    return 301 https://$host$request_uri;
}

# ==========================================
# Monsur Ali Travels ERP - Production Nginx Configuration
# Place in: /etc/nginx/sites-available/monsuralitravels
# ==========================================

upstream backend_upstream {
    server 127.0.0.1:5092;
    keepalive 32;
}

upstream dashboard_upstream {
    server 127.0.0.1:8005;
    keepalive 32;
}

# 1. Dashboard Domain Configuration
server {
    listen 80;
    listen [::]:80;
    server_name admin.monsuralitravels.com dashboard.monsuralitravels.com dashboard.monsuralitravelsbd.com;

    client_max_body_size 100M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    location / {
        proxy_pass http://dashboard_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# 2. Backend API Domain Configuration
server {
    listen 80;
    listen [::]:80;
    server_name api.monsuralitravels.com server.monsuralitravels.com service.monsuralitravels.com server.monsuralitravelsbd.com service.monsuralitravelsbd.com;

    client_max_body_size 100M;

    # Uploads Static Assets
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location /src/uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Documents Static Assets
    location /documents/ {
        alias /var/www/html/documents/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location /src/documents/ {
        alias /var/www/html/documents/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # API Routes
    location / {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

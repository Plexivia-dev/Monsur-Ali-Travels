# ==========================================
# Monsur Ali Travels ERP - Production Nginx Configuration
# Place in: /etc/nginx/sites-available/monsuralitravels
# ==========================================

upstream backend_upstream {
    server 127.0.0.1:5092;
    keepalive 32;
}

upstream admin_dashboard_upstream {
    server 127.0.0.1:8007;
    keepalive 32;
}

upstream client_dashboard_upstream {
    server 127.0.0.1:8005;
    keepalive 32;
}

upstream frontend_upstream {
    server 127.0.0.1:8006;
    keepalive 32;
}


# 1. Admin Dashboard Domain Configuration (Port 8007)
server {
    server_name admin.monsuralitravels.com;

    client_max_body_size 100M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    location / {
        proxy_pass http://admin_dashboard_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.monsuralitravels.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.monsuralitravels.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# 2. Client Dashboard Domain Configuration (Port 8005)

services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: monsuralitravels-postgres-dev
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-MonsurAliSecPass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-monsur_ali_travels_dev}
    ports:
      - "5433:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    networks:
      - monsuralitravels-dev-net

  backend-dev:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: monsuralitravels-backend-dev
    restart: always
    volumes:
      - /var/www/uploads-dev:/app/uploads
      - /var/www/documents-dev:/app/documents
    environment:
      NODE_ENV: development
      PORT: 5093
      DATABASE_URL: ${DATABASE_URL:-postgresql://admin:MonsurAliSecPass2026!@monsuralitravels-postgres-dev:5432/monsur_ali_travels_dev?schema=public}
      JWT_SECRET: ${JWT_SECRET:-monsuralitravels_super_secret_access_token_jwt_2026}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      UPLOAD_PATH: /app/uploads
      DOCUMENT_PATH: /app/documents
      CORS_ORIGIN: "https://dashboard.monsuralitravels.com,https://dashboard.monsuralitravelsbd.com,https://monsuralitravels.com,https://www.monsuralitravels.com,https://monsuralitravelsbd.com,https://www.monsuralitravelsbd.com,http://localhost:5173,http://localhost:8005,http://localhost:8006,http://localhost:8015,*"
    ports:
      - "5093:5093"
    depends_on:
      - postgres-dev
    networks:
      - monsuralitravels-dev-net

  dashboard-dev:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://server.monsuralitravelsbd.com}
    container_name: monsuralitravels-dashboard-dev
    restart: always
    ports:
      - "8015:80"
    networks:
      - monsuralitravels-dev-net

networks:
  monsuralitravels-dev-net:
    driver: bridge

volumes:
  postgres-dev-data:
    driver: local
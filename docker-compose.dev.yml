services:
  mongodb:
    image: mongo:7.0
    container_name: ${MONGODB_CONTAINER_NAME:-monsuralitravels-mongodb-dev}
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-11223345}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-perfume-store}
    ports:
      - "0.0.0.0:27017:27017"
    volumes:
      - mongodb-data-dev:/data/db
    networks:
      - monsuralitravels-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${BACKEND_CONTAINER_NAME:-monsuralitravels-backend-dev}
    restart: always
    env_file:
      - .env
    environment:
      PORT: ${BACKEND_PORT:-5092}
    ports:
      - "${BACKEND_PORT:-5092}:${BACKEND_PORT:-5092}"
    volumes:
      - /var/www/uploads:/app/uploads
    depends_on:
      - mongodb
    networks:
      - monsuralitravels-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ${FRONTEND_CONTAINER_NAME:-monsuralitravels-frontend-dev}
    restart: always
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-8001}:8001"
    networks:
      - monsuralitravels-network

  dashboard:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: ${DASHBOARD_CONTAINER_NAME:-monsuralitravels-dashboard-dev}
    restart: always
    env_file:
      - .env
    ports:
      - "${DASHBOARD_PORT:-8005}:8005"
    networks:
      - monsuralitravels-network

networks:
  monsuralitravels-network:
    driver: bridge

volumes:
  mongodb-data-dev:
    driver: local
name: monsuralitravels-dev

services:
  mongodb-dev:
    image: mongo:7.0
    container_name: monsuralitravels-mongodb-dev
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-devpassword123}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-monsur-ali-travels-dev}
    ports:
      - "27018:27017"
    volumes:
      - mongodb-dev-data:/data/db
    networks:
      - monsuralitravels-dev-net

  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monsuralitravels-backend-dev
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - /dev-env/var/www/uploads:/app/uploads
      - /dev-env/var/www/uploads:/app/src/uploads
      - /dev-env/var/www/documents:/app/documents
      - /dev-env/var/www/documents:/app/src/documents
    environment:
      NODE_ENV: development
      PORT: 5093
    ports:
      - "5093:5093"
    depends_on:
      - mongodb-dev
    networks:
      - monsuralitravels-dev-net

  dashboard-client-dev:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.client
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://server.plexivia.online}
    container_name: monsuralitravels-dashboard-client-dev
    restart: always
    ports:
      - "8015:80"
    networks:
      - monsuralitravels-dev-net

  dashboard-admin-dev:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.admin
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://server.plexivia.online}
    container_name: monsuralitravels-dashboard-admin-dev
    restart: always
    ports:
      - "8017:80"
    networks:
      - monsuralitravels-dev-net

networks:
  monsuralitravels-dev-net:
    driver: bridge

volumes:
  mongodb-dev-data:
    driver: local